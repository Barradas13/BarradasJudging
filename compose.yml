version: "3.9"

services:
  flask_app:
    image: barradas13/judge
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PROBLEMS_JSON_B64=${PROBLEMS_JSON_B64}
      - JUDGE_URL=http://judge:7000
      - PORT=${PORT}
  judge:
    image: judge0/judge0
    container_name: judge0
    ports:
      - "7000:7000"
